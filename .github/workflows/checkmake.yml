---
name: checkmake
'on':
  pull_request:
    paths: &paths
      - Makefile
  push:
    branches: [master]
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: sh
env:
  CM_BIN: /usr/local/bin/checkmake
  CM_URL: https://github.com/checkmake/checkmake/releases/download/v0.3.2/checkmake-v0.3.2.linux.amd64 # yamllint disable-line
jobs:
  checkmake:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.CM_BIN }}
          key: checkmake-0.3.2-${{ runner.os }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo curl \
            --fail \
            --location \
            --output "$CM_BIN" \
            --show-error \
            --silent \
            "$CM_URL"
          sudo chmod +x "$CM_BIN"
      - run: $CM_BIN Makefile
