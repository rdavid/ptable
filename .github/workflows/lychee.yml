#
# Checks the links of the published pages weekly, since links rot without
# any change to the repository.
---
name: lychee
'on':
  pull_request:
    paths: &paths
      - .github/pages/**
      - README.adoc
  push:
    branches: [master]
    paths: *paths
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: sh
jobs:
  lychee:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --no-progress
            ./.github/pages/README-docinfo.html
            ./README.adoc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
