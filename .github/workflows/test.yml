#
# Ubuntu lacks a redo package, so the Linux job runs the test directly.
---
name: test
'on':
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: sh
jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-15-intel
          - macos-26
          - macos-26-intel
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: |
          g++ -std=c++03 -Wall -Werror -pedantic -o app main.cpp
          ./app 2>app.log >/dev/null
          diff expected.log app.log
      - if: runner.os == 'macOS'
        run: |
          brew install \
            rdavid/tap/goredo \
            rdavid/tap/shellbase
          redo -xx
